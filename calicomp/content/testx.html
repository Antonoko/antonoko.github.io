<!DOCTYPE HTML>
<html>

<head>
<title>Worth</title>
<style type="text/css">

</style>

</head>

<body>


<canvas id="worth" width="1200" height="800" style=" background-color:#ebebeb">
Your browser does not support the canvas element.
</canvas>

<script type="text/javascript">

//坐标轴
var c=document.getElementById("worth");
var ctx=c.getContext("2d");

ctx.font = "13px Arial";
ctx.fillStyle="#000000";
ctx.textAlign = "center";
ctx.fillText("昂贵",(1200/2)-20,20);
ctx.fillText("廉价",(1200/2)-20,800-20);
ctx.fillText("不值得",30,(800/2)+20);
ctx.fillText("值得",1200-20,(800/2)-10);

//物品
ctx.font = "13px Arial";
ctx.fillStyle="#d43e8b";
ctx.textAlign = "left";
//象限1
ctx.fillText("◼︎ iPad 2018 with Pencil",1200*0.87,800*0.15);
ctx.fillText("◼︎ MIX2",1200*0.7,800*0.17);
ctx.fillText("◼︎ Lenovo hackintosh",1200*0.75,800*0.06);
ctx.fillText("◼︎ Nintendo Switch",1200*0.6,800*0.2);
ctx.fillText("◼︎ GX-85",1200*0.53,800*0.11);
ctx.fillText("◼︎ Kindle Paperwhite 3",1200*0.6,800*0.27);
ctx.fillText("◼︎ SHP9500",1200*0.7,800*0.4);
ctx.fillText("◼︎ QCY30",1200*0.8,800*0.4);
ctx.fillText("◼︎ Magic Trackpad 2",1200*0.5,800*0.33);
ctx.fillText("◼︎ iPod touch 6",1200*0.52,800*0.25);
ctx.fillText("◼︎ Pebble 2",1200*0.55,800*0.31);

//象限2
ctx.fillStyle="#1ab055";
ctx.fillText("◼︎ 1-2 Switch",1200*0.07,800*0.27);
ctx.fillText("◼︎ 305sh",1200*0.1,800*0.2);
ctx.fillText("◼︎ Steam Controller",1200*0.35,800*0.35);
ctx.fillText("◼︎ 8bitdo Controller",1200*0.4,800*0.43);


//象限3
ctx.fillStyle="#3449dd";
ctx.fillText("◼︎ MI VR",1200*0.25,800*0.68);

//象限4
ctx.fillStyle="#df8e1a";
ctx.fillText("◼︎ Magnet Dock",1200*0.72,800*0.6);

var c=document.getElementById("worth");
var cxt=c.getContext("2d");
cxt.fillStyle="#000000";
cxt.fillRect(0,800/2,1200,1);
cxt.fillRect(1200/2,0,1,800);


</script>
<br><br>


</body>
</html>

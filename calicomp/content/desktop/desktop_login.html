/*--------------------------------- 右键菜单 ----------------------------------------*/ 
a:link {color: #000000;text-decoration:none;}
#ul1{ width:130px; height:90px;  font-family: fzxs15;  color:#000000; padding:10px 3px; background:#e0dace; border-top:2px solid #ffffff; border-bottom:2px solid #626262; border-left:2px solid #ffffff; border-right:2px solid #626262; display:none; position:absolute; left:0;top:0;}  
#ul1 li{ width:130px; height:28px; line-height:28px; font-size:14px;font-family: fzxs15;  text-align:left; list-style:none}  
#ul1 li:hover{ background:#000a73;color:#ffffff;}  

    </style> 
    
    
    <script type="text/javascript">  
    /*--------------------------------- 右键菜单 ----------------------------------------*/ 
window.onload=function()  
{  
var ul=document.getElementById("ul1")  
document.oncontextmenu=function(ev)  
{  
var ev=ev||window.event  
var l=ev.clientX  
var t=ev.clientY  
ul.style.display="block"  
ul.style.left=l+'px'  
ul.style.top=t-16+'px'  
return false;  
}  
document.onclick=function()  
{  
ul.style.display="none"  
}  
}  
</script>

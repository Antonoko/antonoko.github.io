<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>视频封面生成器</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a4f91'/%3E%3Cpath d='M18 22h20a6 6 0 0 1 6 6v14H18z' fill='white'/%3E%3Cpath d='m44 29 9-5v17l-9-5z' fill='white'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>封面生成器</h1>
        </div>
        <button class="export-button" id="exportButton" type="button">
          <span>导出封面</span>
          <span class="export-size">1920 × 1080 PNG</span>
        </button>
      </header>

      <section class="workspace">
        <aside class="control-panel" aria-label="封面设置">
          <div class="panel-section">
            <p class="title-guideline"><strong>标题统一使用 Sentence case：</strong>仅大写句子的第一个字母和专有名词（如人名、地名、品牌名等），其余单词一律小写。</p>
            <label class="field-label" for="titleInput">主标题</label>
            <textarea id="titleInput" rows="3" maxlength="120">Analyze your competitors’ activity</textarea>
            <div class="field-count" id="titleCount">35 / 120</div>

            <label class="field-label" for="subtitleInput">副标题</label>
            <textarea id="subtitleInput" rows="2" maxlength="160" placeholder="输入一句补充说明">Research the fundamentals side by side</textarea>
            <div class="field-count" id="subtitleCount">38 / 160</div>
          </div>

          <div class="panel-section">
            <label class="guide-toggle" for="guideToggle">
              <span>
                <strong>显示图标推荐范围</strong>
                <small>300 × 200 px</small>
              </span>
              <input id="guideToggle" type="checkbox" checked />
              <span class="toggle-ui" aria-hidden="true"></span>
            </label>

            <label class="upload-zone" for="iconInput">
              <input id="iconInput" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" />
              <span class="upload-icon">＋</span>
              <span class="upload-copy"><strong id="uploadTitle">拖拽/上传图标</strong><small>PNG、JPG、WebP 或 SVG</small></span>
              <span class="upload-action">选择文件</span>
            </label>
            <div class="icon-actions">
              <span id="iconFileName">尚未上传</span>
              <button id="removeIcon" type="button" disabled>移除</button>
            </div>

            <div class="slider-group">
              <div class="slider-row">
                <label for="iconSize">图标大小</label>
                <output id="iconSizeValue">180 px</output>
              </div>
              <input id="iconSize" type="range" min="64" max="360" value="180" />
            </div>

            <div class="position-grid">
              <div class="slider-group">
                <div class="slider-row">
                  <label for="iconX">水平位置</label>
                  <output id="iconXValue">0 px</output>
                </div>
                <input id="iconX" type="range" min="-600" max="600" value="0" />
              </div>
              <div class="slider-group">
                <div class="slider-row">
                  <label for="iconY">垂直位置</label>
                  <output id="iconYValue">0 px</output>
                </div>
                <input id="iconY" type="range" min="-260" max="260" value="0" />
              </div>
            </div>

            <button class="reset-button" id="resetPosition" type="button">重置图标位置</button>
          </div>
        </aside>

        <section class="preview-panel">
          <div class="canvas-wrap" id="canvasWrap">
            <canvas id="coverCanvas" width="1920" height="1080" aria-label="视频封面预览"></canvas>
            <div class="icon-guide" id="iconGuide" aria-hidden="true"></div>
          </div>
          <p class="preview-tip">提示：上传图标后，可直接在画布上拖动调整位置。</p>
        </section>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite">封面已导出</div>
    <div class="drop-overlay" id="dropOverlay" aria-hidden="true">
      <div>
        <span>↓</span>
        <strong>松开以上传图标</strong>
        <small>将替换当前图标</small>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
